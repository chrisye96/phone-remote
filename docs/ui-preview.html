<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>界面方案预览</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  body { margin:0; padding:24px 16px 40px; background:#1b1d22; color:#e8eaf0; font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  h1 { font-size:20px; font-weight:600; text-align:center; margin:0 0 4px; }
  h2 { font-size:17px; font-weight:600; text-align:center; margin:36px 0 14px; }
  .sub { text-align:center; color:#9aa1b0; font-size:13px; margin:0; }
  .frames { display:flex; flex-wrap:wrap; gap:28px; justify-content:center; }
  figure { margin:0; } figcaption { text-align:center; font-size:14px; margin-bottom:10px; color:#c6cbd6; }
  .phone { width:360px; height:700px; border-radius:34px; padding:14px 14px 0; box-sizing:border-box; display:flex; flex-direction:column; gap:9px; overflow:hidden; border:3px solid #33363e; }
  .phone button { font:inherit; border:0; padding:0 2px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .row { display:grid; gap:8px; }
  .padrow { flex:1; min-height:60px; display:flex; gap:8px; }
  .single h1, .single .sub { display:none; } .single h2 { margin-top:0; } .single .frames { flex-wrap:nowrap; }
  .legend { display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-top:26px; font-size:13px; color:#c6cbd6; }
  .legend span::before { content:""; display:inline-block; width:12px; height:12px; border-radius:4px; margin-right:6px; vertical-align:-1px; background:var(--c); }

  /* ---------- 现在 ---------- */
  .old { background:#0e0f13; color:#eceef3; }
  .old .head { display:flex; font-size:12px; color:#8a91a0; }
  .old .now { font-size:12px; color:#8a91a0; text-align:center; } .old .now b { color:#eceef3; font-weight:500; }
  .old .prog { height:4px; border-radius:2px; background:#343945; position:relative; margin:4px 30px 6px; } .old .prog i { position:absolute; left:0; top:0; bottom:0; width:35%; background:#6c8cff; border-radius:2px; }
  .old .pad { flex:1; background:#181a20; border-radius:18px; display:flex; align-items:center; justify-content:center; color:#8a91a0; font-size:12px; }
  .old .strip { width:48px; display:flex; flex-direction:column; gap:8px; } .old .strip button { flex:1; height:auto; }
  .old button { background:#22252d; color:#eceef3; border-radius:14px; height:44px; font-size:14px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.07); }
  .old button small { display:block; font-size:10px; color:#8a91a0; }
  .old .label { font-size:12px; color:#8a91a0; }
  .old .chips { display:flex; gap:6px; background:#181a20; border-radius:12px; padding:4px; } .old .chips button { flex:1; height:30px; background:transparent; box-shadow:none; color:#8a91a0; font-size:13px; border-radius:9px; } .old .chips .sel { background:#343945; color:#eceef3; }
  .old .ta { background:#181a20; border-radius:14px; padding:10px 14px; height:40px; font-size:14px; color:#6b7280; box-shadow:inset 0 0 0 1px rgba(255,255,255,.07); }
  .old .primary { background:#6c8cff; color:#fff; }
  .old .list { flex:1; display:flex; flex-direction:column; gap:6px; overflow:hidden; } .old .win { background:#181a20; border-radius:14px; padding:8px 14px; font-size:14px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.07); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .old .win small { display:block; font-size:11px; color:#8a91a0; } .old .win.active { box-shadow:inset 0 0 0 1.5px #6c8cff; }
  .old .bar { display:grid; grid-template-columns:1fr 1fr 68px 1fr 1fr; align-items:center; height:64px; flex:none; border-radius:24px; background:#1b1e25; }
  .old .bar button { background:transparent; box-shadow:none; font-size:22px; } .old .bar .play { width:56px; height:56px; border-radius:50%; background:#6c8cff; color:#fff; justify-self:center; }
  .old .nav { display:flex; flex:none; margin:0 -14px; padding:6px 14px 10px; background:#181a20; } .old .nav button { flex:1; background:transparent; box-shadow:none; color:#8a91a0; font-size:11px; height:44px; } .old .nav i { display:block; font-size:20px; } .old .nav .sel { color:#6c8cff; }

  /* ---------- 方案一、二共用 ---------- */
  .new { --bg:#0a0c11; --panel:#141821; --key:#2b313d; --line:rgba(255,255,255,.12); --text:#f4f6fa; --dim:#a3abbb; --play:#5b8cff;
         background:var(--bg); color:var(--text); }
  .new .head { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--dim); flex:none; }
  .new .head .dot { width:8px; height:8px; border-radius:50%; background:#3ddc97; }
  .new .head .vol { margin-left:auto; color:#2ec4a6; font-weight:600; }
  .new .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:10px 12px; flex:none; }
  .new .now { font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .new .time { display:flex; align-items:center; gap:8px; font-size:11px; color:var(--dim); margin-top:8px; font-variant-numeric:tabular-nums; }
  .new .prog { flex:1; height:6px; border-radius:3px; background:#333a48; position:relative; } .new .prog i { position:absolute; left:0; top:0; bottom:0; width:35%; background:var(--play); border-radius:3px; }
  .new .prog b { position:absolute; left:35%; top:-5px; width:16px; height:16px; margin-left:-8px; border-radius:50%; background:#fff; }
  .new .pad { flex:1; border-radius:18px; border:1.5px dashed rgba(255,255,255,.22); background:radial-gradient(rgba(255,255,255,.10) 1px, transparent 1.4px) 0 0/16px 16px, #10141c;
              display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--dim); font-size:12px; gap:4px; }
  .new .pad .ti { font-size:22px; }
  .new .strip { width:48px; display:flex; flex-direction:column; gap:8px; } .new .strip button { flex:1; height:auto; }
  .new button { background:var(--key); color:var(--text); border-radius:14px; height:48px; font-size:12px; border-top:1px solid rgba(255,255,255,.14); box-shadow:0 2px 0 rgba(0,0,0,.45); }
  .new button .ti { display:block; font-size:19px; margin-bottom:1px; }
  .new .c-play { background:#243357; } .new .c-play .ti { color:#8fb0ff; }
  .new .c-vol { background:#17403b; } .new .c-vol .ti { color:#5fe0c5; }
  .new .c-exit { background:#4a2a2a; } .new .c-exit .ti { color:#ff9c8f; }
  .new .c-nav { background:#473a1c; } .new .c-nav .ti { color:#ffd27a; }
  .new .primary { background:var(--play); color:#fff; font-size:14px; } .new .primary .ti { display:inline; font-size:18px; margin-right:6px; vertical-align:-2px; }
  .new em { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:5px; }
  .new .chips { display:flex; gap:6px; flex:none; } .new .chips button { flex:1; height:32px; font-size:13px; border-radius:16px; background:transparent; border:1px solid var(--line); box-shadow:none; color:var(--dim); }
  .new .chips .sel { background:#3b2030; border-color:#fb7299; color:#fff; }
  .new .ta { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:10px 14px; height:40px; font-size:14px; color:#7d8696; flex:none; }
  .new .label { font-size:11px; color:var(--dim); margin:1px 2px -4px; letter-spacing:.5px; flex:none; }
  .new .list { flex:1; display:flex; flex-direction:column; gap:6px; overflow:hidden; }
  .new .win { display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:8px 12px; font-size:13px; }
  .new .win .av { width:30px; height:30px; border-radius:9px; background:#2b313d; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; color:#cfd5e1; flex:none; }
  .new .win div { min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .new .win small { display:block; font-size:11px; color:var(--dim); }
  .new .win.active { border-color:var(--play); background:#182036; } .new .win.active .av { background:var(--play); color:#fff; }
  .new .win .tag { margin-left:auto; font-size:11px; color:#8fb0ff; flex:none; }
  .new .bar { display:grid; grid-template-columns:1fr 1fr 72px 1fr 1fr; align-items:center; height:68px; flex:none; border-radius:24px; background:var(--panel); border:1px solid var(--line); padding:0 4px; }
  .new .bar button { background:transparent; border:0; box-shadow:none; height:54px; font-size:10px; color:var(--dim); } .new .bar button .ti { font-size:24px; color:var(--text); }
  .new .bar .v .ti { color:#5fe0c5; }
  .new .play { width:60px; height:60px; border-radius:50%; background:var(--play) !important; justify-self:center; box-shadow:0 0 0 5px rgba(91,140,255,.22) !important; } .new .play .ti { font-size:28px !important; color:#fff !important; margin:0; }
  .new .nav { display:flex; flex:none; margin:0 -14px; padding:6px 14px 10px; background:var(--panel); border-top:1px solid var(--line); } .new .nav button { flex:1; background:transparent; border:0; box-shadow:none; color:var(--dim); font-size:11px; height:46px; border-radius:12px; }
  .new .nav .ti { font-size:21px; } .new .nav .sel { color:#fff; background:#243357; } .new .nav .sel .ti { color:#8fb0ff; }

  /* ---------- 方案二：分组、胶囊键、大小主次 ---------- */
  .v2 .rocker { display:flex; background:var(--key); border-radius:14px; border-top:1px solid rgba(255,255,255,.14); box-shadow:0 2px 0 rgba(0,0,0,.45); overflow:hidden; }
  .v2 .rocker button { flex:1; background:transparent; border:0; box-shadow:none; border-radius:0; }
  .v2 .rocker button + button { border-left:1px solid rgba(255,255,255,.16); }
  .v2 .rocker.col { flex-direction:column; width:48px; } .v2 .rocker.col button { height:auto; } .v2 .rocker.col button + button { border-left:0; border-top:1px solid rgba(255,255,255,.16); }
  .v2 .rocker.c-play { background:#243357; } .v2 .rocker.c-vol { background:#17403b; } .v2 .rocker.c-nav { background:#473a1c; }
  .v2 .rocker.c-play .ti { color:#8fb0ff; } .v2 .rocker.c-vol .ti { color:#5fe0c5; } .v2 .rocker.c-nav .ti { color:#ffd27a; }
  .v2 .group { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:9px; display:flex; flex-direction:column; gap:8px; flex:none; }
  .v2 .group.bili { border-color:rgba(251,114,153,.45); }
  .v2 .gtitle { font-size:11px; color:var(--dim); margin:-1px 2px -3px; letter-spacing:.5px; }
  .v2 .big { font-size:14px; } .v2 .big .ti { display:inline; font-size:20px; margin:0 7px 0 0; vertical-align:-3px; }
  .v2 .tabs { display:flex; gap:4px; } .v2 .tabs button { flex:1; height:28px; font-size:12px; border-radius:14px; background:transparent; border:0; box-shadow:none; color:var(--dim); } .v2 .tabs .sel { background:#3b2030; color:#fff; }
  .v2 .bar2 { display:grid; grid-template-columns:104px 1fr 50px; gap:8px; align-items:center; flex:none; }
  .v2 .seek { display:grid; grid-template-columns:1fr 64px 1fr; align-items:center; height:68px; border-radius:34px; background:var(--panel); border:1px solid var(--line); }
  .v2 .seek button { background:transparent; border:0; box-shadow:none; } .v2 .seek button .ti { font-size:24px; margin:0; }
  .v2 .bar2 .rocker button, .v2 .mute { height:54px; } .v2 .bar2 .rocker .ti, .v2 .mute .ti { font-size:22px; margin:0; }
  .v2 .compose { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:10px; display:flex; flex-direction:column; gap:8px; flex:none; }
  .v2 .compose .hint { font-size:14px; color:#7d8696; padding:2px 4px 14px; }
  .v2 .site { font-size:13px; height:40px; }
</style>
</head>
<body>
<h1>四个页面：现在、方案一、方案二</h1>
<p class="sub">静态示意图，按钮不能点</p>
<div id="out"></div>

<div class="legend">
  <span style="--c:#5b8cff">蓝：播放和进度、主操作</span>
  <span style="--c:#2ec4a6">青：音量</span>
  <span style="--c:#ff7b6b">红：退出、关闭、删除</span>
  <span style="--c:#f2b84b">黄：确认和跳转</span>
  <span style="--c:#2b313d">灰：其他</span>
</div>

<script>
const ic = name => `<i class="ti ti-${name}"></i>`;
const b = (icon, label, cls = "") => `<button class="${cls}">${icon ? ic(icon) : ""}${label}</button>`;      // 方案里的按钮：图标 + 文字
const ob = (label, small) => `<button>${label}${small ? `<small>${small}</small>` : ""}</button>`;              // 现在的按钮：只有文字
const rocker = (cls, ...items) => `<div class="rocker ${cls}">${items.map(([i, l, c]) => b(i, l, c || "")).join("")}</div>`;
const row = (cols, ...cells) => `<div class="row" style="grid-template-columns:${cols}">${cells.join("")}</div>`;
const NAV = [["device-tv", "播放"], ["world", "浏览"], ["keyboard", "输入"], ["app-window", "窗口"]];
const nav = (sel, br) => `<div class="nav">${NAV.map(([i, l], n) => `<button class="${n === sel ? "sel" : ""}">${ic(i)}${br ? "<br>" : ""}${l}</button>`).join("")}</div>`;
const WINDOWS = [["chrome", "群论之美宣传片_哔哩哔哩 - Google Chrome", true], ["Spotify", "聚散太匆匆"], ["claude", "Claude"], ["explorer", "phone-remote - 文件资源管理器"]];

const oldBar = `<div class="bar"><button>${ic("volume-2")}</button><button>${ic("player-track-prev")}</button><button class="play">${ic("player-pause")}</button><button>${ic("player-track-next")}</button><button>${ic("volume")}</button></div>`;
const v1Bar = `<div class="bar"><button class="v">${ic("volume-2")}音量 −</button><button>${ic("player-track-prev")}快退</button><button class="play">${ic("player-pause")}</button><button>${ic("player-track-next")}快进</button><button class="v">${ic("volume")}音量 +</button></div>`;
const v2Bar = `<div class="bar2">${rocker("c-vol", ["volume-2", ""], ["volume", ""])}<div class="seek"><button>${ic("player-track-prev")}</button><button class="play">${ic("player-pause")}</button><button>${ic("player-track-next")}</button></div><button class="c-vol mute">${ic("volume-off")}</button></div>`;
const head = `<div class="head"><span class="dot"></span><span>Luna</span><span class="vol">${ic("volume")} 30</span></div>`;
const oldHead = `<div class="head"><span>● 已连接 · Luna</span><span style="margin-left:auto">音量 30</span></div>`;
const nowCard = `<div class="card"><div class="now">群论之美宣传片_哔哩哔哩</div><div class="time"><span>4:46</span><div class="prog"><i></i><b></b></div><span>13:38</span></div></div>`;
const oldPad = text => `<div class="padrow"><div class="pad">${text}</div><div class="strip"><button>▲</button><button>▼</button></div></div>`;
const v1Pad = `<div class="padrow"><div class="pad">${ic("hand-finger")}触控板</div><div class="strip">${b("chevron-up", "")}${b("chevron-down", "")}</div></div>`;
const v2Pad = `<div class="padrow"><div class="pad">${ic("hand-finger")}触控板</div>${rocker("col", ["chevron-up", ""], ["chevron-down", ""])}</div>`;
const dot = c => `<em style="background:${c}"></em>`;
const chips = `<button>通用</button><button class="sel">${dot("#fb7299")}B站</button><button>${dot("#ff4e45")}YouTube</button><button>${dot("#1ed760")}音乐</button>`;

const screens = {
  "播放": [
    oldHead + `<div class="now">正在播放　<b>群论之美宣传片_哔哩哔哩</b></div><div class="prog"><i></i></div>` + oldPad("触控板")
      + `<div class="grid">${ob("静音")}${ob("全屏", "F")}${ob("退出", "Esc")}${ob("确定", "回车")}</div>`
      + `<div class="chips"><button>通用</button><button class="sel">B站</button><button>YouTube</button><button>音乐</button></div>`
      + `<div class="grid">${["上一集", "下一集", "弹幕"].map(l => ob(l)).join("")}${ob("静音", "播放器")}${["音量 +", "音量 −", "点赞", "收藏"].map(l => ob(l)).join("")}</div>` + oldBar + nav(0),
    head + nowCard + v1Pad
      + `<div class="grid">${b("volume-off", "静音", "c-vol")}${b("maximize", "全屏", "c-play")}${b("x", "退出", "c-exit")}${b("check", "确定", "c-nav")}</div>`
      + `<div class="chips">${chips}</div>`
      + `<div class="grid">${b("player-skip-back", "上一集", "c-play")}${b("player-skip-forward", "下一集", "c-play")}${b("message-2", "弹幕")}${b("thumb-up", "点赞")}${b("volume-2", "播放器 −", "c-vol")}${b("volume", "播放器 +", "c-vol")}${b("volume-off", "播放器静音", "c-vol")}${b("star", "收藏")}</div>` + v1Bar + nav(0, true),
    head + nowCard + v2Pad
      + row("2fr 1fr 1fr", b("maximize", "全屏", "c-play big"), b("x", "退出", "c-exit"), b("check", "确定", "c-nav"))
      + `<div class="group bili"><div class="tabs">${chips}</div>`
      + row("2fr 1fr 1fr", rocker("c-play", ["player-skip-back", "上一集"], ["player-skip-forward", "下一集"]), b("message-2", "弹幕"), b("thumb-up", "点赞"))
      + row("3fr 1fr", rocker("c-vol", ["minus", "播放器音量"], ["volume-off", "静音"], ["plus", "播放器音量"]), b("star", "收藏")) + `</div>` + v2Bar + nav(0, true),
  ],
  "浏览": [
    oldHead + oldPad("滑动移动鼠标　轻点单击<br>双指轻点右键　双指滑动滚动")
      + `<div class="grid">${["后退", "前进", "刷新", "关标签", "◀ 标签", "标签 ▶", "缩小", "放大", "B站", "YouTube", "新标签"].map(l => ob(l)).join("")}</div>` + oldBar + nav(1),
    head + v1Pad
      + `<div class="grid">${b("arrow-left", "后退", "c-nav")}${b("arrow-right", "前进", "c-nav")}${b("refresh", "刷新")}${b("x", "关标签", "c-exit")}`
      + `${b("chevron-left", "上个标签", "c-nav")}${b("chevron-right", "下个标签", "c-nav")}${b("zoom-out", "缩小")}${b("zoom-in", "放大")}`
      + `<button>${dot("#fb7299")}B站</button><button>${dot("#ff4e45")}YouTube</button>${b("plus", "新标签")}</div>` + v1Bar + nav(1, true),
    head + v2Pad
      + `<div class="group"><div class="gtitle">页面</div>`
      + row("2fr 1fr 1fr", rocker("c-nav", ["arrow-left", "后退"], ["arrow-right", "前进"]), b("refresh", "刷新"), rocker("", ["zoom-out", ""], ["zoom-in", ""]))
      + `<div class="gtitle">标签页</div>`
      + row("2fr 1fr 1fr", rocker("c-nav", ["chevron-left", "上一个"], ["chevron-right", "下一个"]), b("plus", "新建"), b("x", "关闭", "c-exit")) + `</div>`
      + row("1fr 1fr", `<button class="site">${dot("#fb7299")}打开 B站</button>`, `<button class="site">${dot("#ff4e45")}打开 YouTube</button>`) + v2Bar + nav(1, true),
  ],
  "输入": [
    oldHead + `<div class="ta">在这里打字，或点键盘上的麦克风说话…</div>` + row("1fr 1.4fr", ob("只输入"), `<button class="primary">输入并回车</button>`) + oldPad("触控板")
      + `<div class="grid">${ob("回车")}${ob("换行")}${ob("退格")}${ob("停止", "Esc")}${ob("全选")}${ob("撤销")}${ob("新对话", "AI")}${ob("电脑听写", "开 / 关")}${ob("地址栏", "浏览器")}${ob("新标签", "浏览器")}${ob("Tab")}${ob("切换窗口")}</div>` + oldBar + nav(2),
    head + `<div class="ta">在这里打字，或点键盘上的麦克风说话…</div>` + row("1fr 1.4fr", b("", "只输入"), b("send", "输入并回车", "primary")) + v1Pad
      + `<div class="grid">${b("corner-down-left", "回车", "c-nav")}${b("arrow-bar-down", "换行")}${b("backspace", "退格", "c-exit")}${b("player-stop", "停止", "c-exit")}`
      + `${b("select-all", "全选")}${b("arrow-back-up", "撤销")}${b("message-plus", "新对话")}${b("microphone", "电脑听写", "c-play")}`
      + `${b("link", "地址栏")}${b("plus", "新标签")}${b("arrow-bar-to-right", "Tab")}${b("switch-horizontal", "切换窗口")}</div>` + v1Bar + nav(2, true),
    head + `<div class="compose"><div class="hint">在这里打字，或点键盘上的麦克风说话…</div>` + row("1fr 1.6fr", b("", "只输入"), b("send", "输入并回车", "primary")) + `</div>` + v2Pad
      + `<div class="group">` + row("2fr 1fr 1fr", b("corner-down-left", "回车", "c-nav big"), b("arrow-bar-down", "换行"), b("backspace", "退格", "c-exit"))
      + row("1fr 1fr 1fr 1fr", b("select-all", "全选"), b("arrow-back-up", "撤销"), b("arrow-bar-to-right", "Tab"), b("player-stop", "停止", "c-exit")) + `</div>`
      + row("2fr 1fr 1fr", b("microphone", "电脑听写", "c-play big"), b("message-plus", "新对话"), b("link", "地址栏")) + v2Bar + nav(2, true),
  ],
  "窗口": [
    oldHead + `<div class="label">点一下切换到那个窗口</div><div class="list">${WINDOWS.map(([a, t, on]) => `<div class="win ${on ? "active" : ""}"><small>${a}</small>${t}</div>`).join("")}</div>`
      + `<div class="grid">${ob("上一个窗口")}${ob("全部窗口", "再用触控板选")}${ob("最大化")}${ob("最小化")}${ob("换屏幕", "移到电视")}${ob("网页全屏", "F11")}</div>` + oldBar + nav(3),
    head + `<div class="label">点一下切换到那个窗口</div><div class="list">${WINDOWS.map(([a, t, on]) => `<div class="win ${on ? "active" : ""}"><span class="av">${a[0].toUpperCase()}</span><div>${t}<small>${a}</small></div>${on ? `<span class="tag">当前</span>` : ""}</div>`).join("")}</div>`
      + `<div class="grid">${b("switch-horizontal", "上一个窗口", "c-nav")}${b("layout-grid", "全部窗口")}${b("maximize", "最大化")}${b("minus", "最小化")}${b("screen-share", "换屏幕", "c-nav")}${b("arrows-maximize", "网页全屏", "c-play")}</div>` + v1Bar + nav(3, true),
    head + `<div class="label">点一下切换到那个窗口</div><div class="list">${WINDOWS.map(([a, t, on]) => `<div class="win ${on ? "active" : ""}"><span class="av">${a[0].toUpperCase()}</span><div>${t}<small>${a}</small></div>${on ? `<span class="tag">当前</span>` : ""}</div>`).join("")}</div>`
      + `<div class="group"><div class="gtitle">当前窗口</div>`
      + row("2fr 2fr", b("screen-share", "移到电视屏幕", "c-nav big"), rocker("", ["minus", "最小化"], ["maximize", "最大化"]))
      + row("1fr 1fr 1fr", b("switch-horizontal", "上一个窗口"), b("layout-grid", "全部窗口"), b("arrows-maximize", "网页全屏", "c-play")) + `</div>` + v2Bar + nav(3, true),
  ],
};

const TITLES = ["现在", "方案一：上色加图标，仍是平铺", "方案二：分组、胶囊键、大小主次"];
const CLASSES = ["old", "new", "new v2"];
// 网址后面加 ?only=浏览 只看一个页面
const only = new URLSearchParams(location.search).get("only");
if (only) document.body.classList.add("single");
document.getElementById("out").innerHTML = Object.entries(screens).filter(([name]) => !only || name === only).map(([name, frames]) =>
  `<h2 id="${name}">${name}页</h2><div class="frames">${frames.map((html, n) => `<figure><figcaption>${TITLES[n]}</figcaption><div class="phone ${CLASSES[n]}">${html}</div></figure>`).join("")}</div>`).join("");
</script>
</body>
</html>
