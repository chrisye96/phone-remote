<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="遥控器">
<title>遥控器</title>
<style>
  :root {
    --bg:#0e0f13; --surface:#181a20; --key:#22252d; --key-on:#343945; --line:rgba(255,255,255,.07);
    --text:#eceef3; --dim:#8a91a0; --accent:#6c8cff; --accent-on:#5270e0; --ok:#4cc38a; --bad:#e5645f;
    --keyh:clamp(40px, 6.4dvh, 54px); --gap:10px;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; }
  html { height:100%; background:var(--bg); }
  body { margin:0 auto; height:100%; height:100dvh; max-width:520px; overflow:hidden; overscroll-behavior:none;
         background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         display:flex; flex-direction:column; padding:calc(8px + env(safe-area-inset-top)) 16px 0; }
  svg { width:22px; height:22px; fill:currentColor; display:block; margin:0 auto; pointer-events:none; }

  /* 顶部状态 */
  header { display:flex; align-items:center; gap:8px; height:28px; flex:none; font-size:13px; color:var(--dim); }
  #dot { width:8px; height:8px; border-radius:50%; background:var(--dim); }
  #dot.ok { background:var(--ok); } #dot.bad { background:var(--bad); }

  /* 按键 */
  button { font:inherit; color:inherit; background:var(--key); border:0; border-radius:14px; height:var(--keyh); font-size:15px; padding:0 2px;
           box-shadow:inset 0 0 0 1px var(--line); touch-action:manipulation; transition:transform .08s, background .08s; }
  button.on { background:var(--key-on); transform:scale(.96); }
  button small { display:block; font-size:10px; color:var(--dim); margin-top:1px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:var(--gap); }
  .label { font-size:12px; color:var(--dim); margin:2px 2px -4px; }

  /* 页面 */
  .screen { flex:1; min-height:0; display:none; flex-direction:column; gap:var(--gap); padding:6px 0 10px; }
  body[data-screen="play"] #play, body[data-screen="pad"] #padscreen, body[data-screen="type"] #type, body[data-screen="wins"] #wins { display:flex; }

  /* 窗口页 */
  #winlist { flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; gap:6px; border-radius:14px; }
  #winlist button { flex:none; height:auto; min-height:52px; padding:8px 14px; text-align:left; font-size:14px; touch-action:pan-y;
                    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:var(--surface); }
  #winlist button small { margin:0 0 2px; font-size:11px; }
  #winlist button.active { box-shadow:inset 0 0 0 1.5px var(--accent); }
  #winlist p { color:var(--dim); font-size:13px; text-align:center; margin:auto; }

  /* 网站切换 */
  .chips { display:flex; gap:6px; background:var(--surface); border-radius:12px; padding:4px; flex:none; }
  .chips button { flex:1; height:32px; font-size:13px; border-radius:9px; background:transparent; box-shadow:none; color:var(--dim); }
  .chips button.sel { background:var(--key-on); color:var(--text); }
  .site { display:none; } .site.sel { display:grid; }

  /* 触控板页 */
  .padrow { flex:1; min-height:120px; display:flex; gap:var(--gap); }
  .pad { flex:1; background:var(--surface); border-radius:18px; box-shadow:inset 0 0 0 1px var(--line); display:flex; align-items:center; justify-content:center;
         color:var(--dim); font-size:12px; text-align:center; line-height:1.9; touch-action:none; }
  .pad.on { background:#1d2027; }

  /* 播放键：播放中是实心亮色 + 暂停图标，暂停时是空心描边 + 播放图标 */
  .playbtn svg { display:none; }
  .playbtn[data-state="unknown"] .s-unknown, .playbtn[data-state="playing"] .s-pause, .playbtn[data-state="paused"] .s-play { display:block; }
  #now { flex:none; height:18px; font-size:13px; color:var(--dim); text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #now b { color:var(--text); font-weight:500; }
  .strip { display:flex; flex-direction:column; gap:var(--gap); width:52px; }
  .strip button { flex:1; height:auto; }

  /* 输入页 */
  textarea { font:inherit; font-size:16px; color:var(--text); background:var(--surface); border:0; box-shadow:inset 0 0 0 1px var(--line); border-radius:14px;
             padding:10px 14px; height:62px; resize:none; outline:none; flex:none; user-select:text; -webkit-user-select:text; }
  textarea:focus { box-shadow:inset 0 0 0 1.5px var(--accent); }
  .sendrow { display:grid; grid-template-columns:1fr 1.4fr; gap:var(--gap); }
  .primary { background:var(--accent); color:#fff; box-shadow:none; } .primary.on { background:var(--accent-on); }
  .spacer { flex:1; }

  /* 常驻的播放条：音量、快退、播放暂停、快进 */
  .bar { flex:none; display:grid; grid-template-columns:1fr 1fr 72px 1fr 1fr; align-items:center; height:68px; padding:0 6px; margin-bottom:10px;
         border-radius:24px; background:linear-gradient(180deg,#20232b,#17191f); box-shadow:inset 0 0 0 1px var(--line), 0 8px 24px rgba(0,0,0,.3); }
  .bar button { height:56px; background:transparent; box-shadow:none; border-radius:16px; }
  .bar button svg { width:24px; height:24px; }
  .bar button.on { background:rgba(255,255,255,.07); transform:none; }
  .bar .playbtn { width:60px; height:60px; border-radius:50%; justify-self:center; background:var(--accent); color:#fff; box-shadow:0 4px 18px rgba(108,140,255,.4); }
  .bar .playbtn svg { width:28px; height:28px; }
  .bar .playbtn.on { background:var(--accent-on); transform:scale(.94); }
  .bar .playbtn[data-state="paused"] { background:var(--key); color:var(--accent); box-shadow:inset 0 0 0 2px var(--accent); }

  /* 底部导航 */
  nav { display:flex; flex:none; margin:0 -16px; padding:6px 16px calc(6px + env(safe-area-inset-bottom)); background:var(--surface); box-shadow:0 -1px 0 var(--line); }
  nav button { flex:1; height:46px; background:transparent; box-shadow:none; border-radius:10px; color:var(--dim); font-size:11px; }
  nav button svg { margin-bottom:3px; }
  nav button.sel { color:var(--accent); }
  nav button.on { transform:none; background:transparent; }

  #toast { position:fixed; left:50%; top:calc(44px + env(safe-area-inset-top)); transform:translateX(-50%); max-width:86vw; background:#2b2f39; color:var(--text);
           padding:9px 14px; border-radius:12px; font-size:13px; box-shadow:0 6px 24px rgba(0,0,0,.4); opacity:0; pointer-events:none; transition:opacity .2s; z-index:9; }
  #toast.show { opacity:1; } #toast.bad { background:#5a2a2a; }
</style>
</head>
<body data-screen="play">

<svg style="display:none">

  <symbol id="i-win" viewBox="0 0 24 24"><path d="M8 3h11a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-1v-2h1V7H8v1H6V5a2 2 0 0 1 2-2zM5 10h9a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2zm0 4v5h9v-5z"/></symbol>
  <symbol id="i-tv"viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-6v2h3v2H7v-2h3v-2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 2v10h16V6zm6 2l5 3-5 3z"/></symbol>
</svg>

<header><span id="dot"></span><span id="status">正在连接…</span></header>
<div id="toast"></div>

<!-- data-k 是按键组合；mod 表示 Windows 的 Ctrl / Mac 的 Command；data-mac 是 Mac 上写法不同时用的；data-repeat 表示长按连发 -->

<!-- 播放 -->
<section class="screen" id="play">
  <div id="now"></div>
  <div class="padrow">
    <div class="pad">触控板</div>
    <div class="strip">
      <button data-scroll="250" data-repeat>▲</button>
      <button data-scroll="-250" data-repeat>▼</button>
    </div>
  </div>

  <div class="grid">
    <button data-k="mute">静音</button>
    <button data-k="f">全屏<small>F</small></button>
    <button data-k="esc">退出<small>Esc</small></button>
    <button data-k="enter">确定<small>回车</small></button>
  </div>

  <div class="chips">
    <button data-site="any">通用</button>
    <button data-site="bili">B站</button>
    <button data-site="yt">YouTube</button>
  </div>

  <div class="grid site" id="any">
    <button data-k="up" data-repeat>↑</button>
    <button data-k="down" data-repeat>↓</button>
    <button data-k="c">字幕<small>C</small></button>
    <button data-k="media">播放键<small>后台也有效</small></button>
  </div>
  <div class="grid site" id="bili">
    <button data-k="[">上一集</button>
    <button data-k="]">下一集</button>
    <button data-k="d">弹幕</button>
    <button data-k="m">静音<small>播放器</small></button>
    <button data-k="up" data-repeat>音量 +<small>播放器</small></button>
    <button data-k="down" data-repeat>音量 −<small>播放器</small></button>
    <button data-k="q">点赞</button>
    <button data-k="e">收藏</button>
  </div>
  <div class="grid site" id="yt">
    <button data-k="shift+p">上一个</button>
    <button data-k="shift+n">下一个</button>
    <button data-k="j" data-repeat>−10 秒</button>
    <button data-k="l" data-repeat>+10 秒</button>
    <button data-k="shift+,">减速</button>
    <button data-k="shift+.">加速</button>
    <button data-k="c">字幕</button>
    <button data-k="t">影院模式</button>
  </div>
</section>

<!-- 浏览 -->

  <div class="padrow">
    <div class="pad">滑动移动鼠标　轻点单击　连点两下双击<br>双指轻点右键　双指滑动滚动</div>
    <div class="strip">

<!-- 输入 -->
<section class="screen" id="type">
  <textarea id="text" enterkeyhint="send" autocomplete="off" placeholder="在这里打字，或点键盘上的麦克风说话。内容会输入到电脑当前的输入框。"></textarea>

  <div class="padrow">
    <div class="pad">触控板</div>

      <button data-scroll="250" data-repeat>▲</button>

  <div class="label">点一下切换到那个窗口</div>

  <div class="grid">
    <button data-k="alt+tab" data-mac="mod+tab">上一个窗口</button>
    <button data-k="win+tab" data-mac="ctrl+up">全部窗口<small>再用触控板选</small></button>
    <button data-k="win+up" data-mac="ctrl+mod+f">最大化</button>
    <button data-k="win+down" data-mac="mod+m">最小化</button>

    <button data-k="f11" data-only="win">网页全屏<small>F11</small></button>
  </div>
</section>

<div class="bar">
  <button data-k="voldown" data-repeat><svg><use href="#i-voldown"/></svg></button>
  <button data-k="left" data-repeat><svg><use href="#i-rew"/></svg></button>
  <button class="playbtn" data-k="space" data-state="unknown"><svg class="s-unknown"><use href="#i-play"/></svg><svg class="s-play"><use href="#i-playonly"/></svg><svg class="s-pause"><use href="#i-pause"/></svg></button>
  <button data-k="right" data-repeat><svg><use href="#i-ff"/></svg></button>
  <button data-k="volup" data-repeat><svg><use href="#i-volup"/></svg></button>
</div>

<nav>
  <button data-go="play"><svg><use href="#i-tv"/></svg>播放</button>
  <button data-go="pad"><svg><use href="#i-globe"/></svg>浏览</button>
  <button data-go="type"><svg><use href="#i-kbd"/></svg>输入</button>
  <button data-go="wins"><svg><use href="#i-win"/></svg>窗口</button>
</nav>

<script>
const PLATFORM = "__PLATFORM__";
const HOST = __HOST__;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const token = location.hash.slice(1) || store.get("token") || "";
if (token) store.set("token", token);

// 连接状态和提示
const dot = document.getElementById("dot"), statusText = document.getElementById("status"), toastBox = document.getElementById("toast");
let toastTimer;
function toast(text, bad) {
  toastBox.textContent = text;
  toastBox.className = "show" + (bad ? " bad" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastBox.className = ""; }, bad ? 4000 : 1200);
}
function setStatus(ok, text) {
  if (!ok && dot.className !== "bad") toast(text, true);
  dot.className = ok ? "ok" : "bad";
  statusText.textContent = ok ? "已连接 · " + HOST : text;
}

// 发指令给电脑；成功返回 true（有数据时返回数据），失败返回 false
function send(data) {
  if (!token) { setStatus(false, "还没配对：请扫电脑上的二维码打开"); return Promise.resolve(false); }
  return fetch("/api", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Token": token },
    body: JSON.stringify(data),
  }).then(r => {
    if (r.status === 403) setStatus(false, "配对失效：请重新扫电脑上的二维码");
    else setStatus(true);
    if (!r.ok) return false;
    return r.status === 200 ? r.json() : true;
  }).catch(() => { setStatus(false, "连不上电脑：检查程序是否开着、是否同一个 Wi-Fi"); return false; });
}
send({ a: "ping" });
document.addEventListener("visibilitychange", () => { if (!document.hidden) send({ a: "ping" }); });

// 按钮：按下立即触发，带 data-repeat 的长按连发
document.querySelectorAll("button[data-k], button[data-scroll]").forEach(btn => {
  let delay, repeat;
  const fire = () => send(btn.dataset.scroll
    ? { a: "scroll", dy: Number(btn.dataset.scroll) }
    : { a: "key", k: (PLATFORM === "mac" && btn.dataset.mac) || btn.dataset.k });
  const stop = () => { clearTimeout(delay); clearInterval(repeat); btn.classList.remove("on"); };
  btn.addEventListener("pointerdown", e => {
    e.preventDefault();
    btn.classList.add("on");
    fire();
    if (btn.hasAttribute("data-repeat")) delay = setTimeout(() => { repeat = setInterval(fire, 130); }, 400);
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(t => btn.addEventListener(t, stop));
  btn.addEventListener("contextmenu", e => e.preventDefault());
});

// 页面和网站切换，记住上次的选择
function pick(selector, attr, value, storeKey) {
  document.querySelectorAll(selector).forEach(b => b.classList.toggle("sel", b.dataset[attr] === value));
  store.set(storeKey, value);
}
function go(screen) {
  document.body.dataset.screen = screen;
  pick("nav button", "go", screen, "screen");
  if (document.activeElement) document.activeElement.blur();
  if (screen === "wins") loadWindows();
}

// 窗口列表：点一项就把那个窗口切到最前
const winList = document.getElementById("winlist");
function loadWindows() {
  send({ a: "windows" }).then(list => {
    winList.textContent = "";
    if (!Array.isArray(list) || !list.length) {
      const p = document.createElement("p");
      p.textContent = list === false ? "读取不到窗口列表" : "没有打开的窗口";
      winList.appendChild(p);
      return;
    }
    list.forEach(w => {
      const btn = document.createElement("button");
      if (w.active) btn.className = "active";
      if (w.app) { const app = document.createElement("small"); app.textContent = w.app; btn.appendChild(app); }
      btn.appendChild(document.createTextNode(w.title));
      btn.addEventListener("click", () => send({ a: "focus", id: w.id }).then(() => setTimeout(loadWindows, 350)));
      winList.appendChild(btn);
    });
  });
}
document.querySelectorAll("[data-only]").forEach(b => { if (b.dataset.only !== PLATFORM) b.remove(); });
document.querySelectorAll("#wins .grid button").forEach(b => b.addEventListener("pointerup", () => setTimeout(loadWindows, 500)));
function setSite(site) {
  pick(".chips button", "site", site, "site");
  document.querySelectorAll(".site").forEach(d => d.classList.toggle("sel", d.id === site));
}
document.querySelectorAll("nav button").forEach(b => b.addEventListener("pointerdown", () => go(b.dataset.go)));
document.querySelectorAll(".chips button").forEach(b => b.addEventListener("pointerdown", () => setSite(b.dataset.site)));
go(["play", "pad", "type", "wins"].includes(store.get("screen")) ? store.get("screen") : "play");
setSite(["any", "bili", "yt"].includes(store.get("site")) ? store.get("site") : "any");

// 文字输入：手机上打字或听写，发到电脑当前的输入框里
const textInput = document.getElementById("text");
function sendText(enter) {
  const t = textInput.value.trim();
  if (!t && !enter) { toast("先在上面输入文字"); return; }
  send({ a: "text", t, enter }).then(ok => { if (ok) { textInput.value = ""; toast(enter ? "已输入并回车" : "已输入"); } });
}
document.getElementById("sendText").addEventListener("click", () => sendText(false));
document.getElementById("sendEnter").addEventListener("click", () => sendText(true));
textInput.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); sendText(true); } });

// 播放状态：定时问电脑当前是播放还是暂停，更新播放键的样子
const playButtons = document.querySelectorAll(".playbtn"), nowBox = document.getElementById("now");
let playing = null;
function showState(state) {
  playing = state.playing;
  const name = playing === true ? "playing" : playing === false ? "paused" : "unknown";
  playButtons.forEach(b => { b.dataset.state = name; });
  nowBox.textContent = "";
  if (playing !== null && state.title) {
    nowBox.textContent = playing ? "正在播放　" : "已暂停　";
    const b = document.createElement("b");
    b.textContent = state.title;
    nowBox.appendChild(b);
  }
}
function pollState() {
  if (document.hidden || !token) return;
  send({ a: "state" }).then(state => { if (state && typeof state === "object") showState(state); });
}
setInterval(pollState, 1500);
pollState();
document.addEventListener("visibilitychange", pollState);
// 按下后先按预期翻转，再向电脑确认
playButtons.forEach(b => b.addEventListener("pointerdown", () => {
  if (playing !== null) showState({ playing: !playing, title: nowBox.lastChild ? nowBox.lastChild.textContent : "" });
  setTimeout(pollState, 900);
}));

// 触控板（播放、浏览、输入页各有一块，共用一套手势）
const SPEED = 1.7;
let pending = { dx: 0, dy: 0, scroll: 0 }, busy = false;

function flush() {
  if (busy) return;
  const dx = Math.round(pending.dx), dy = Math.round(pending.dy), scroll = Math.round(pending.scroll);
  if (!dx && !dy && !scroll) return;
  pending.dx -= dx; pending.dy -= dy; pending.scroll -= scroll;
  busy = true;
  const jobs = [];
  if (dx || dy) jobs.push(send({ a: "move", dx, dy }));
  if (scroll) jobs.push(send({ a: "scroll", dy: scroll }));
  Promise.all(jobs).then(() => { busy = false; flush(); });
}

function initPad(pad) {
  const pointers = new Map();
  let travel = 0, startTime = 0, maxPointers = 0;
  pad.addEventListener("pointerdown", e => {
    pad.setPointerCapture(e.pointerId);
    if (pointers.size === 0) { travel = 0; startTime = Date.now(); maxPointers = 0; }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    maxPointers = Math.max(maxPointers, pointers.size);
    pad.classList.add("on");
  });
  pad.addEventListener("pointermove", e => {
    const last = pointers.get(e.pointerId);
    if (!last) return;
    const dx = e.clientX - last.x, dy = e.clientY - last.y;
    last.x = e.clientX; last.y = e.clientY;
    travel += Math.abs(dx) + Math.abs(dy);
    if (pointers.size === 1) { pending.dx += dx * SPEED; pending.dy += dy * SPEED; }
    else pending.scroll += dy / pointers.size * 2.5;
    flush();
  });
  function padUp(e) {
    if (!pointers.delete(e.pointerId) || pointers.size) return;
    pad.classList.remove("on");
    const quick = e.type === "pointerup" && Date.now() - startTime < 300;
    if (quick && maxPointers === 1 && travel < 8) send({ a: "click" });
    else if (quick && maxPointers === 2 && travel < 16) send({ a: "click", right: true });
  }
  pad.addEventListener("pointerup", padUp);
  pad.addEventListener("pointercancel", padUp);
}
document.querySelectorAll(".pad").forEach(initPad);
</script>
