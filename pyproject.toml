[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phone-remote"
dynamic = ["version"]
description = "Control your computer's media playback, mouse and keyboard from your phone's browser"
requires-python = ">=3.9"
dependencies = [
    "pystray",
    "Pillow",
    "segno",
    "winrt-runtime; sys_platform == 'win32'",
    "winrt-Windows.Media.Control; sys_platform == 'win32'",
    "winrt-Windows.Foundation; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections; sys_platform == 'win32'",
]

[project.scripts]
phone-remote = "phone_remote.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "phone_remote.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phone_remote = ["web/**/*"]
